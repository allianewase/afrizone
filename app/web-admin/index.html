<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Afrizone Part Time Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin: 0; background: #000066">
    <div id="root">
      <!-- Static boot splash: replaced by React on mount (no white flash) -->
      <div style="position: fixed; inset: 0; display: grid; place-items: center; background: #000066; font-family: 'Raleway', sans-serif">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 26px">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="width: 40px; height: 48px; display: grid; place-items: center">
              <!-- Duplicated from src/components/Logo.tsx on purpose: this markup
                   paints before any JS loads, so it cannot import the component.
                   Keep the two in step. -->
              <svg width="40" height="42" viewBox="0 0 100 105">
                <path d="M32 6 L48 3 L62 8 L68 14 L74 22 L88 26 L100 34 L86 40 L80 52 L84 60 L76 72 L68 84 L58 96 L50 104 L40 96 L32 84 L26 70 L20 60 L10 54 L0 48 L12 40 L8 28 L18 16 Z" fill="#fbac34"/>
                <path d="M80 78 Q86 82 84 90 Q80 95 77 89 Q75 82 80 78 Z" fill="#fbac34"/>
                <path d="M69 34 L41 48" stroke="#000066" stroke-width="4" stroke-linecap="round" fill="none"/>
                <path d="M41 48 L67 48 L59 76 L34 76 Z" fill="#000066"/>
                <path d="M37 58 L63 58 M35 67 L61 67" stroke="#fff" stroke-width="1.5" fill="none" opacity=".5"/>
                <rect x="35" y="40" width="6" height="8" rx="2" fill="#000066"/>
                <rect x="43" y="36" width="9" height="12" rx="2" fill="#000066"/>
                <rect x="54" y="38" width="8" height="10" rx="2" fill="#000066"/>
                <circle cx="42" cy="86" r="5.5" fill="#000066"/>
                <circle cx="56" cy="86" r="5.5" fill="#000066"/>
              </svg>
            </span>
            <span style="font-weight: 800; font-size: 22px; letter-spacing: -.02em; color: #fff">AfriZoneMart.com</span>
          </div>
          <div style="width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: #fbac34; animation: azspin .8s linear infinite"></div>
        </div>
      </div>
      <style>@keyframes azspin { to { transform: rotate(360deg) } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
