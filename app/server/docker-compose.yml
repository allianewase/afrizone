# Local "prod-like" stack: real Postgres + the server image. For everyday
# dev without Docker, use `npm run db:start` instead (see scripts/dev-db.js).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afrizone
      POSTGRES_PASSWORD: afrizone
      POSTGRES_DB: afrizone
    ports:
      - "5432:5432"
    volumes:
      - afrizone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrizone"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://afrizone:afrizone@postgres:5432/afrizone?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell or a .env file next to this compose file}
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  afrizone_pgdata:
