name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # wrangler/miniflare (server tests) require Node >=22; kept in sync with
  # local dev (v24).
  NODE_VERSION: "24"

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/web-admin/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
